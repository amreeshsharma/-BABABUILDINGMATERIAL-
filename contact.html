<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="contact-section" id="contact">

    <div class="contact-container">

        <div class="contact-info">

            <span class="section-tag">
                GET IN TOUCH
            </span>

            <h2>
                Let's Build
                <span>Something Strong.</span>
            </h2>

            <p>
                Have a construction project or need
                building materials? Contact us and
                discuss your requirements.
            </p>

            <div class="contact-details">

                <div class="contact-item">

                    <div class="contact-icon">
                        ☎
                    </div>

                    <div>

                        <small>
                            Call Us
                        </small>

                        <a href="tel:9926251258">
                            9926251258
                        </a>

                    </div>

                </div>

                <div class="contact-item">

                    <div class="contact-icon">
                        💬
                    </div>

                    <div>

                        <small>
                            WhatsApp
                        </small>

                        <a
                            href="https://wa.me/919926251258"
                            target="_blank"
                        >
                            Start a Conversation
                        </a>

                    </div>

                </div>

            </div>

            <a
                class="whatsapp-btn"
                href="https://wa.me/919926251258"
                target="_blank"
            >
                💬 Chat on WhatsApp
            </a>

        </div>

        <div class="contact-form">

            <h3>
                Send Your Requirement
            </h3>

            <p>
                Tell us what material you need.
            </p>

            <form id="enquiry-form">

                <div class="form-row">

                    <input
                        type="text"
                        placeholder="Your Name"
                        required
                    >

                    <input
                        type="tel"
                        placeholder="Phone Number"
                        required
                    >

                </div>

                <select required>

                    <option value="">
                        Select Material
                    </option>

                    <option>
                        Cement
                    </option>

                    <option>
                        Bricks
                    </option>

                    <option>
                        Sand
                    </option>

                    <option>
                        Stone / Gitti
                    </option>

                    <option>
                        Steel / Sariya
                    </option>

                    <option>
                        Tiles
                    </option>

                    <option>
                        Pipes & Fittings
                    </option>

                    <option>
                        Other
                    </option>

                </select>

                <textarea
                    rows="5"
                    placeholder="Tell us about your requirement..."
                ></textarea>

                <button type="submit">
                    Send Enquiry →
                </button>

            </form>

        </div>

    </div>

</section>
    
</body>
</html>
